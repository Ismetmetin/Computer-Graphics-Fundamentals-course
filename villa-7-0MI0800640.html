<!DOCTYPE html>

<!-- Исмет Метин Исмет -->

<html>

<head>
	<style>
		body {
			margin: 0;
		}

		canvas {
			width: 100%;
			height: 100%
		}
	</style>
	<script type="importmap">
			{ "imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
				"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
				"villa": "https://boytchev.github.io/CourseOKG/villa.js",
				"csg/": "https://cdn.jsdelivr.net/gh/looeee/threejs-csg@main/src/CSG/"
				
			} }
		</script>
</head>

<body>
	<script type="module">
		import * as THREE from "three";
		import { CSG } from "csg/CSG.js";
		import { villa, renderer, scene, camera, light, contraLight, controls } from "villa";

		villa('0MI0800640'); // да е реалния фак.н.

		// 1. преименувайте файла на villa-g-fn.html,
		//    g=номер на група, а fn=факултетен номер
		//    също попълнете коментара на третия ред!
		//
		// 2. първо сменете параметъра на villa( ) да
		//    е факултетният ви номер - по този начин
		//    ще се генерират сцена, земя и контур на
		//    вилата ви, която ще трябва да направите
		//
		// 3. едва тогава почвайте да строите стените
		//    и да добавяте исканите обекти по стаите
		//
		// 4. кубът по-долу е само за пример как може
		//    да се слагат обекти, които правят сянка
		//
		// 5. белите квадратчета имат размер 20x20 см
		//
		// 6. горд съм как коментарите са равно дълги :)

		//има минимален шанс west да съответства на положителния х вместо отрицателния.
		//Причина: гледах формата на вилата да е L отколкото огледално Г  

		const wallWidth = 0.2;
		const wallHeight = 3;
		const wallMaterial = new THREE.MeshLambertMaterial({ color: 0xAF00BF });
		const standartDoorLength = 6 * 0.2;
		const standartDoorHeight = 2.3

		const offset = 0.1;

		const doorToRemove = new THREE.Mesh(new THREE.BoxGeometry(2 * offset, standartDoorHeight, standartDoorLength), new THREE.MeshPhongMaterial({ color: "orange" }));



		function createWall(length = 1, xPos = 0, zPos = 0, isVertical = 0) {
			if (isVertical != 0) {
				let wallGeometry = new THREE.BoxGeometry(wallWidth, wallHeight, length);
				let wallMesh = new THREE.Mesh(wallGeometry, wallMaterial);
				wallMesh.position.set(xPos - offset, wallHeight / 2, zPos)
				wallMesh.receiveShadow = true;
				wallMesh.castShadow = true;
				return wallMesh;
			}
			else {
				let wallGeometry = new THREE.BoxGeometry(length, wallHeight, wallWidth);
				let wallMesh = new THREE.Mesh(wallGeometry, wallMaterial);
				wallMesh.position.set(xPos, wallHeight / 2, zPos + offset)
				wallMesh.receiveShadow = true;
				wallMesh.castShadow = true;
				return wallMesh;
			}
		}
		let csgWindows = new CSG();

		let outerWalls = new THREE.Group();
		scene.add(outerWalls);

		const westWall = createWall(14, 5, 2 + 2 * offset, 1);

		const southWall = createWall(10, 0, -5);

		const southEastWall = createWall(6, -5 + 2 * offset, -2, 1);

		const eastHorizontalWall = createWall(3, -3.5, 1 - 2 * offset);

		const northEastWall = createWall(8.2, -2 + 2 * offset, 5 - offset, 1);

		const northWall = createWall(5, 0.5, 9);
		outerWalls.add(northWall);

		csgWindows.union([southEastWall, southWall, eastHorizontalWall, northEastWall, westWall])
		const windowHole = new THREE.Mesh(new THREE.BoxGeometry(1, 1.5, 2.4), new THREE.MeshPhongMaterial({ color: "red" }));
		windowHole.position.set(-2, wallHeight * 0.55, 5.5)
		csgWindows.subtract([windowHole])

		windowHole.position.set(-3.5, wallHeight / 2, 1)
		csgWindows.subtract([windowHole])

		windowHole.position.set(-5, wallHeight / 2, -2)
		csgWindows.subtract([windowHole])

		windowHole.scale.set(1, 0.3, 1)
		windowHole.position.set(5, wallHeight * 0.76, -2.5)
		csgWindows.subtract([windowHole])

		outerWalls.add(csgWindows.toMesh());


		//да сменим на екструдна геометрия сега може би csg щеше дае по лесно
		var extrudeSettings = {
			depth: 0.2,
			bevelEnabled: false,
		};

		var shape = new THREE.Shape();
		shape.moveTo(3, 0);
		shape.lineTo(3 + 1 * 0.2, 0);
		shape.lineTo(3 + 1 * 0.2, 2.3);
		shape.lineTo(3 + 7 * 0.2, 2.3);
		shape.lineTo(3 + 7 * 0.2, 0);
		shape.lineTo(3 + 9 * 0.2, 0);
		shape.lineTo(3 + 9 * 0.2, 3);
		shape.lineTo(3, 3);
		shape.lineTo(3, 0);

		var entranceGeometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
		var entrance = new THREE.Mesh(entranceGeometry, wallMaterial);
		entrance.position.set(0, 0, 9);
		outerWalls.add(entrance);


		let csg = new CSG();
		let innerWalls = new THREE.Group();
		scene.add(innerWalls);

		let innerVerticalNorthWall = createWall(5, 2 + 2 * offset, 5 + 1.5, 1);
		innerWalls.add(innerVerticalNorthWall);

		let innerNorthWesternWall = createWall(3, 2 + 1.5, 4);
		doorToRemove.rotation.y = Math.PI / 2;
		doorToRemove.position.set(3 + 5 * offset, standartDoorHeight / 2, 4.1);
		csg.subtract([innerNorthWesternWall, doorToRemove]);

		let innerWestWall = createWall(4, 1 + 2, -0.4);
		doorToRemove.position.set(1 + 2, standartDoorHeight / 2, -0.3);
		csg.union([innerWestWall]);
		csg.subtract([doorToRemove]);

		let southWallVert = createWall(4.8, 1, -2.5 - offset, 1);
		innerWalls.add(southWallVert);

		//почва забавата с кривата стена..
		let loshaStena = createWall(2.5, 1.47, 2.9);
		loshaStena.rotation.y = Math.PI * 2 / 3;
		//innerWalls.add(loshaStena);

		doorToRemove.rotation.y = Math.PI * 2 / 3 + Math.PI / 2;
		doorToRemove.position.set(1.47, standartDoorHeight / 2, 2.9)
		doorToRemove.scale.set(1.5, 1, 1)
		csg.union([loshaStena]);
		csg.subtract([doorToRemove]);
		innerWalls.add(csg.toMesh());


		//e to ne bilo tolkova trudno samo trqbva da doizravnq
		let eastWall = createWall(2.80, -offset * 5, 1.83);
		innerWalls.add(eastWall);

		let csg2 = new CSG();
		let wall1 = eastWall.clone();
		let wall2 = loshaStena.clone();
		wall1.scale.set(1.2, 1, 1);
		wall2.scale.set(1.2, 1, 1);
		csg2.intersect([wall1, wall2]);

		innerWalls.add(csg2.toMesh());

		//време е за столчетo (модерно)
		const legLength = 0.6;
		const legUpperRad = 0.02;
		const legLowerRad = 0.01;
		const shellRadius = offset * 5
		const shellGeometry = new THREE.SphereGeometry(shellRadius, 32, 16);
		const shellMaterial = new THREE.MeshLambertMaterial({ color: 0xeeeeee, side: THREE.DoubleSide });
		const shell = new THREE.Mesh(shellGeometry, shellMaterial);
		const inside = shell.clone();
		//inside.scale.set(0.9,0.9,0.9)
		const csg3 = new CSG();
		shell.position.set(0, legLength + 3 * offset, 0)
		inside.position.set(0, legLength + 3 * offset + .15, .15)
		csg3.subtract([shell, inside]);

		let modernChairGroup = new THREE.Group();
		modernChairGroup.add(csg3.toMesh())
		let legGroup = new THREE.Group();

		const legGeometry = new THREE.CylinderGeometry(legUpperRad, legLowerRad, legLength);
		const legMaterial = new THREE.MeshPhongMaterial({ color: "pink" });
		const legBody = new THREE.Mesh(legGeometry, legMaterial);
		const sphereGeometry = new THREE.SphereGeometry(0.01);
		const gumenkaMaterial = new THREE.MeshPhongMaterial({ color: "black" });
		const gumenka = new THREE.Mesh(sphereGeometry, gumenkaMaterial);
		gumenka.position.set(0, -legLength / 2, 0);
		legGroup.add(legBody);
		legGroup.add(gumenka);
		legGroup.position.set(2, 3, 2)
		for (let i = -1; i < 2; i += 2) {
			for (let j = -1; j < 2; j += 2) {
				let legCopy = legGroup.clone();
				legCopy.position.set(j * 3 * offset, legLength / 2, -i * 3 * offset);
				legCopy.rotation.set(0, i * j * Math.PI / 4, j * Math.PI / 8);
				modernChairGroup.add(legCopy);
				// csg3.subtract([legCopy])
			}
		}


		const cushionGeometry = new THREE.SphereGeometry(offset, 32, 16);
		const cushionMaterials = [
			new THREE.MeshPhongMaterial({ color: 0x8000ff }),
			new THREE.MeshPhongMaterial({ color: 0xff8800 }),
			new THREE.MeshPhongMaterial({ color: 0x80e0fe0 }),
			new THREE.MeshPhongMaterial({ color: 0xBB43AF})
		];


		function addModernChair(material, x = 0, z = 0, angle = 0) {
			const copyOfChair = modernChairGroup.clone();

			const cushion = new THREE.Mesh(cushionGeometry, material);
			const cushionSeat = cushion.clone();

			cushion.rotation.x = Math.PI / 3
			cushion.scale.set(3, 0.8, 3.5)
			cushion.position.set(0, legLength + offset * 2, -0.17);

			//cushionSeat.rotation.x = Math.PI/3
			cushionSeat.scale.set(3.1, 1, 3.5)
			cushionSeat.position.set(0, legLength + 0.02, 0.005);

			copyOfChair.add(cushion);
			copyOfChair.add(cushionSeat);
			copyOfChair.traverse((child) => {
				if (child.isMesh) {
					child.receiveShadow = true;
					child.castShadow = true;
				}
			});

			copyOfChair.position.set(x, -0.015, z)
			copyOfChair.rotation.y = angle;


			return copyOfChair
		}

		scene.add(addModernChair(cushionMaterials[1], -4.2, -3, Math.PI / 2 + Math.PI / 12));
		scene.add(addModernChair(cushionMaterials[0], -2.8, -4.2, -Math.PI * (1 / 6)));

		//подвижна стълба?!
		let ladderGroup = new THREE.Group()
		scene.add(ladderGroup)
		var extrudeSettings = {
					depth: 0.05,
					bevelEnabled: false
				}; 

		let frontSupportPath = new THREE.Shape();
		frontSupportPath.moveTo(0.1,0)
		frontSupportPath.lineTo(0.2,0)
		frontSupportPath.lineTo(1.1,1.61)
		frontSupportPath.lineTo(1,1.61)
		frontSupportPath.lineTo(0.1,0)

		let frontSupport1 = new THREE.ExtrudeGeometry( frontSupportPath, extrudeSettings )
		let ladderMainMaterial = new THREE.MeshPhongMaterial({color: "pink"})
		
		let mainRight = new THREE.Mesh(frontSupport1,ladderMainMaterial)
		let mainLeft = mainRight.clone()
		let backRight = mainRight.clone()
		let backLeft = mainRight.clone()

		mainLeft.position.set(-0.1,0.1,0)
		mainRight.position.set(-0.1,0.1,0.7)
		backRight.rotation.y = Math.PI
		backLeft.rotation.y = Math.PI;
		backRight.position.set(1.95,0,0.05)
		backLeft.position.set(1.95,0,0.75)
		ladderGroup.add(mainRight)
		ladderGroup.add(mainLeft)
		ladderGroup.add(backLeft)
		ladderGroup.add(backRight)
		
		
		for(let i = 1; i < 4; i++)
		{
			let step = new THREE.Mesh(new THREE.BoxGeometry(0.1,0.05, 0.7),
			cushionMaterials[i])
			let currentX = 0.137 + i*0.23
			let currentY = 0.2 + i*0.42  //обичаме магически числа.  
			//(ползвах desmos за да ми помогне да си сметна координатите на стъпалата) ^

			step.position.set(currentX,currentY,0.375)
			ladderGroup.add(step);
		}

		let notStep = new THREE.Mesh(new THREE.BoxGeometry(0.05,0.05, 0.7),
		 new THREE.MeshPhongMaterial({color: "black"}))
		notStep.position.set(0.65+0.137+ 2*0.23, 1, 0.375);
		ladderGroup.add(notStep)

		ladderGroup.position.set(-1,0,5)
		ladderGroup.rotation.y = Math.PI/3


	</script>

</body>

</html>
